[package]
name = "wacko"
version = "0.1.0"
edition = "2024"


[dependencies]
cortex-m = { version = "0.7.9" }
cortex-m-rt = "0.7.7"

defmt = "1.1.1"
defmt-rtt = "1.3.0"

embassy-executor = { version = "0.9", default-features = false, features = [
    "arch-cortex-m",
    "defmt",
    "executor-interrupt",
    "executor-thread",
] }

embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-nrf = { version = "0.11.0", features = ["defmt", "gpiote", "nrf52833"] }

microbit-bsp = { git = "https://github.com/lulf/microbit-bsp.git" }

panic-probe = "1.0.0"
static_cell = "2.1.1"

trouble-host = { version = "0.8.0", features = ["defmt", "gatt", "peripheral"] }
nrf-sdc = { version = "0.4.0", default-features = false, features = [
    "defmt",
    "peripheral",
    "nrf52833",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52833",
] }

[patch.crates-io]
