[package]
name = "wacko"
version = "0.1.0"
edition = "2024"


[dependencies]
cortex-m = { version = "0.7.9" }
cortex-m-rt = "0.7.7"

defmt = "1.1.1"
defmt-rtt = "1.3.0"

embassy-executor = { version = "0.9", default-features = false, features = [
    "arch-cortex-m",
    "defmt",
    "executor-interrupt",
    "executor-thread",
] }

embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.11.0", features = [
    "defmt",
    "gpiote",
    "nrf52833",
    "time-driver-rtc1",
] }


nrf-softdevice = { version = "0.1.0", features = [
    "defmt",
    "ble-peripheral",
    "ble-central",
    "critical-section-impl",
    "nrf52833",
    "s140",
    "ble-l2cap",
    "ble-gatt-server",
    "ble-gatt-client",
    "ble-sec",
] }
nrf-softdevice-s140 = "0.1.2"

panic-probe = "1.0.0"
static_cell = "2.1.1"

[patch.crates-io]
