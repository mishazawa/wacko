[package]
name = "wacko"
version = "0.1.0"
edition = "2024"


[dependencies]
cortex-m = { version = "0.7.9" }
cortex-m-rt = "0.7.7"

defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.9", default-features = false, features = [
    "arch-cortex-m",
    "defmt",
    "executor-interrupt",
    "executor-thread",
] }
embassy-sync = { version = "0.7", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["defmt", "gpiote", "nrf52833"] }
microbit-bsp = { git = "https://github.com/lulf/microbit-bsp.git", features = [
    "trouble",
] }
panic-probe = "1.0.0"
static_cell = "2.1.1"
trouble-host = { version = "0.5", features = ["defmt", "gatt", "peripheral"] }


[patch.crates-io]
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "d4d244d5ce21f59fa2263333cb1d8f2a5d997145" }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "d4d244d5ce21f59fa2263333cb1d8f2a5d997145" }
